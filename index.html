<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMI Kota Batam</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box} body{font-family:Poppins,sans-serif;background:#fff}
.navbar{width:100%;background:#fff;position:sticky;top:0;z-index:1000;box-shadow:0 1px 12px rgba(0,0,0,.07)}
.nav-inner{width:92%;max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;padding:12px 0}
.menu{display:flex;align-items:center;gap:20px}
.menu a{font-size:13px;text-decoration:none;color:#555;font-weight:500}
.menu a.active{color:#b91c1c;font-weight:700}
#loginModal{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:9999;padding:20px}
.login-box{width:100%;max-width:360px;background:#fff;border-radius:20px;padding:26px}
.login-box input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-top:8px;font-size:13px}
</style>
</head>
<body>

<!-- 1. MENU LENGKAP - TIDAK HILANG -->
<nav class="navbar">
  <div class="nav-inner">
    <div style="display:flex;align-items:center;gap:10px"><img src="images/logo-pmi.jpg" style="width:52px;height:52px"><div><b style="color:#b91c1c;font-size:11px">PMI KOTA BATAM</b></div></div>
    <div class="menu">
      <a href="index.html" class="active">Beranda</a>
      <a href="layanan.html">Layanan</a>
      <a href="produk.html">Produk</a>
      <a href="tentang.html">Tentang</a>
      <a href="kontak.html">Kontak</a>
      <a href="https://wa.me/6281170019960" style="background:#b91c1c;color:#fff!important;padding:9px 18px;border-radius:99px;font-weight:700;font-size:12px">Donor Sekarang</a>
    </div>
  </div>
</nav>

<!-- 2. BERANDA ADA FOTO GEDUNG -->
<div style="width:100%;min-height:90vh;background:linear-gradient(rgba(80,10,10,0.88),rgba(110,15,15,0.88)),url('images/gedung.jpg');background-size:cover;display:flex;align-items:center;padding:30px 0">
  <div style="width:92%;max-width:1200px;margin:auto;display:grid;grid-template-columns:1.1fr 0.9fr;gap:40px;align-items:center">
    <div style="color:#fff">
      <h1 style="font-size:48px;line-height:1.05;font-weight:800">E-Katalog<br><span style="color:#fca5a5">PMI Kota</span><br>Batam</h1>
      <p style="margin-top:14px">Stok darah real <b id="stok">575</b> kantong</p>
      <div style="margin-top:26px;display:flex;flex-direction:column;gap:12px;align-items:flex-start">
        <a href="layanan.html" style="background:#f0fdf4;color:#14532d;padding:13px 24px;border-radius:12px;text-decoration:none;font-weight:700;font-size:13px">Lihat Layanan →</a>
        <button onclick="document.getElementById('loginModal').style.display='flex'" style="background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.35);color:#fff;padding:10px 20px;border-radius:99px;font-size:12.5px;font-weight:600;cursor:pointer">Admin Login</button>
      </div>
    </div>
    <div style="background:#fff;border-radius:20px;padding:12px">
      <img src="images/gedung.jpg" style="width:100%;height:380px;object-fit:cover;border-radius:14px">
      <div style="text-align:center;padding:8px"><b style="font-size:13px">Gedung UDD PMI Kota Batam</b></div>
    </div>
  </div>
</div>

<!-- 3. POPUP LOGIN USERNAME & PASSWORD -->
<div id="loginModal">
  <div class="login-box">
    <div style="display:flex;justify-content:space-between"><h3>Admin Login</h3><span onclick="document.getElementById('loginModal').style.display='none'" style="cursor:pointer;font-size:22px">×</span></div>
    <label style="font-size:12px;font-weight:600;margin-top:16px;display:block">Username</label>
    <input id="user" type="text" placeholder="Pmikotabatam2026">
    <label style="font-size:12px;font-weight:600;margin-top:12px;display:block">Password</label>
    <input id="pass" type="password" placeholder="••••••">
    <p id="err" style="font-size:11px;color:red;margin-top:8px;display:none">Username / password salah!</p>
    <button onclick="doLogin()" style="width:100%;padding:12px;background:#b91c1c;color:#fff;border:none;border-radius:10px;font-weight:700;margin-top:16px;cursor:pointer">Masuk</button>
  </div>
</div>

<script>
function doLogin(){
  let u=document.getElementById('user').value.trim();
  let p=document.getElementById('pass').value.trim();
  if(u==='Pmikotabatam2026' && p==='pmi2026'){
    localStorage.setItem('pmi_login','true');
    window.location.href='admin/dashboard.html';
  }else{
    document.getElementById('err').style.display='block';
  }
}
let s=JSON.parse(localStorage.getItem('pmi_stok_simple')||'null');
if(s){let total=s.A+s.B+s.AB+s.O; document.getElementById('stok').innerText=total}
</script>
</body>
</html>
